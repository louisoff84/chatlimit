<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Multi-Mode AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-bounce-1 { animation: bounce 1s infinite; animation-delay: 0s; }
        .animate-bounce-2 { animation: bounce 1s infinite; animation-delay: 0.1s; }
        .animate-bounce-3 { animation: bounce 1s infinite; animation-delay: 0.2s; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .theme-dark { background: #111827; color: #f3f4f6; }
        .theme-night { background: #000000; color: #dbeafe; }
        .card-dark { background: #1f2937; border-color: #374151; }
        .card-night { background: #0f172a; border-color: #1e3a8a; }
    </style>
    <script>
        tailwind.config = {
            safelist: [
                {pattern: /bg-(purple|blue|pink|red|yellow)-(500|600)/},
                {pattern: /text-(purple|blue|pink|red|yellow)-(500|600)/}
            ]
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 transition-colors duration-300" id="app">
    
    <!-- Header -->
    <div class="bg-white shadow-lg border-b border-gray-200 p-4" id="header">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-purple-600 rounded-lg" id="modeIcon">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">Groq Multi-Mode AI</h1>
                        <p class="text-sm opacity-70" id="modeInfo">Mode: Chat • llama-3.3-70b-versatile</p>
                    </div>
                </div>
                
                <button onclick="toggleTheme()" class="p-2 bg-white border border-gray-200 rounded-lg hover:opacity-80" id="themeBtn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>

            <!-- Mode Selector -->
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="setMode('chat')" class="mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-purple-600 text-white transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    <span>Chat</span>
                </button>
                <button onclick="setMode('code')" class="mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200 hover:opacity-80 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                    <span>Code</span>
                </button>
                <button onclick="setMode('image')" class="mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200 hover:opacity-80 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span>Image</span>
                </button>
                <button onclick="setMode('youtube')" class="mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200 hover:opacity-80 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span>YouTube</span>
                </button>
                <button onclick="setMode('extreme')" class="mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200 hover:opacity-80 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span>Extreme</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden" style="height: calc(100vh - 180px);">
        <!-- Chat Area -->
        <div class="flex flex-col" id="chatArea" style="width: 100%;">
            <div class="flex-1 overflow-y-auto p-4" id="messagesContainer">
                <div class="max-w-4xl mx-auto" id="messages">
                    <div class="text-center mt-12 opacity-60" id="welcomeMessage">
                        <svg class="w-16 h-16 mx-auto mb-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                        <p class="text-xl font-semibold">Mode Chat activé</p>
                        <p class="text-sm mt-2">Tu es un assistant IA serviable et précis.</p>
                    </div>
                </div>
            </div>

            <!-- Input -->
            <div class="bg-white border-t border-gray-200 p-4" id="inputArea">
                <div class="max-w-4xl mx-auto flex gap-2">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Message en mode Chat..."
                        class="flex-1 px-4 py-3 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        onkeypress="if(event.key==='Enter') sendMessage()"
                    />
                    <button
                        onclick="sendMessage()"
                        class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2"
                        id="sendBtn"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Code Preview Panel -->
        <div id="codePanel" class="border-l border-gray-200 flex-col hidden" style="width: 50%;">
            <div class="bg-white border-b border-gray-200 p-4 flex items-center justify-between">
                <h2 class="font-semibold">Aperçu & Code</h2>
                <div class="flex gap-2">
                    <button onclick="copyCode()" class="p-2 bg-white border border-gray-200 rounded-lg hover:opacity-80" id="copyBtn">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                    <button onclick="runCode()" class="p-2 bg-blue-600 text-white rounded-lg hover:opacity-90 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Run
                    </button>
                </div>
            </div>
            
            <div class="flex-1 flex flex-col">
                <div class="flex-1 bg-white">
                    <iframe id="preview" class="w-full h-full border-0" sandbox="allow-scripts"></iframe>
                </div>
                
                <div class="h-64 bg-white border-t border-gray-200 overflow-auto">
                    <pre class="p-4 text-sm"><code id="codeDisplay">// Le code apparaîtra ici...</code></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = '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';
        
        let messages = [];
        let currentMode = 'chat';
        let currentTheme = 'light';
        let isLoading = false;
        let codePreview = '';

        const modes = {
            chat: {
                label: 'Chat',
                color: 'purple',
                model: 'llama-3.3-70b-versatile',
                temp: 0.7,
                maxTokens: 2048,
                systemPrompt: 'Tu es un assistant IA serviable et précis.'
            },
            code: {
                label: 'Code',
                color: 'blue',
                model: 'llama-3.3-70b-versatile',
                temp: 0.3,
                maxTokens: 4096,
                systemPrompt: 'Tu es un expert en programmation. Réponds uniquement avec du code propre et bien commenté. Pour HTML/CSS/JS, génère toujours un document HTML complet et fonctionnel.'
            },
            image: {
                label: 'Image',
                color: 'pink',
                model: 'llama-3.2-90b-vision-preview',
                temp: 0.8,
                maxTokens: 1024,
                systemPrompt: 'Tu es un expert en analyse d\'images et en génération de descriptions détaillées.'
            },
            youtube: {
                label: 'YouTube',
                color: 'red',
                model: 'llama-3.3-70b-versatile',
                temp: 0.8,
                maxTokens: 3072,
                systemPrompt: 'Tu es un expert YouTube. Génère des scripts, titres, descriptions et tags optimisés pour le SEO YouTube. Sois créatif et accrocheur.'
            },
            extreme: {
                label: 'Extreme',
                color: 'yellow',
                model: 'llama-3.1-8b-instant',
                temp: 0.9,
                maxTokens: 8192,
                systemPrompt: 'Mode EXTREME activé. Réponds ultra-rapidement avec un maximum de créativité et de détails.'
            }
        };

        function setMode(mode) {
            currentMode = mode;
            const modeConfig = modes[mode];
            
            document.getElementById('modeInfo').textContent = `Mode: ${modeConfig.label} • ${modeConfig.model}`;
            document.getElementById('messageInput').placeholder = `Message en mode ${modeConfig.label}...`;
            
            // Update mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200 hover:opacity-80 transition-all';
            });
            event.target.closest('button').className = `mode-btn flex items-center gap-2 px-4 py-2 rounded-lg bg-${modeConfig.color}-600 text-white transition-all`;
            
            // Show/hide code panel
            if (mode === 'code') {
                document.getElementById('chatArea').style.width = '50%';
                document.getElementById('codePanel').classList.remove('hidden');
                document.getElementById('codePanel').classList.add('flex');
            } else {
                document.getElementById('chatArea').style.width = '100%';
                document.getElementById('codePanel').classList.add('hidden');
                document.getElementById('codePanel').classList.remove('flex');
            }
            
            updateWelcomeMessage();
        }

        function toggleTheme() {
            if (currentTheme === 'light') {
                currentTheme = 'dark';
                document.body.className = 'min-h-screen theme-dark transition-colors duration-300';
                document.getElementById('header').className = 'card-dark shadow-lg border-b p-4';
                document.getElementById('inputArea').className = 'card-dark border-t p-4';
            } else if (currentTheme === 'dark') {
                currentTheme = 'night';
                document.body.className = 'min-h-screen theme-night transition-colors duration-300';
                document.getElementById('header').className = 'card-night shadow-lg border-b p-4';
                document.getElementById('inputArea').className = 'card-night border-t p-4';
            } else {
                currentTheme = 'light';
                document.body.className = 'min-h-screen bg-gray-50 text-gray-900 transition-colors duration-300';
                document.getElementById('header').className = 'bg-white shadow-lg border-b border-gray-200 p-4';
                document.getElementById('inputArea').className = 'bg-white border-t border-gray-200 p-4';
            }
        }

        function updateWelcomeMessage() {
            const modeConfig = modes[currentMode];
            document.getElementById('welcomeMessage').innerHTML = `
                <svg class="w-16 h-16 mx-auto mb-4 text-${modeConfig.color}-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
                <p class="text-xl font-semibold">Mode ${modeConfig.label} activé</p>
                <p class="text-sm mt-2">${modeConfig.systemPrompt}</p>
            `;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const messageText = input.value.trim();
            
            if (!messageText || isLoading) return;
            
            const modeConfig = modes[currentMode];
            
            // Hide welcome message
            document.getElementById('welcomeMessage').style.display = 'none';
            
            // Add user message
            messages.push({ role: 'user', content: messageText });
            addMessageToUI('user', messageText, modeConfig.color);
            
            input.value = '';
            isLoading = true;
            
            // Show loading
            addLoadingIndicator(modeConfig.color);
            
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: modeConfig.model,
                        messages: [
                            { role: 'system', content: modeConfig.systemPrompt },
                            ...messages
                        ],
                        temperature: modeConfig.temp,
                        max_tokens: modeConfig.maxTokens
                    })
                });

                removeLoadingIndicator();

                if (!response.ok) {
                    throw new Error(`Erreur API: ${response.status}`);
                }

                const data = await response.json();
                const content = data.choices[0].message.content;
                
                messages.push({ role: 'assistant', content });
                addMessageToUI('assistant', content, modeConfig.color);
                
                // Handle code mode
                if (currentMode === 'code') {
                    const codeMatch = content.match(/```(?:html|javascript|js|css)?\n?([\s\S]*?)```/);
                    if (codeMatch) {
                        codePreview = codeMatch[1];
                    } else {
                        codePreview = content;
                    }
                    document.getElementById('codeDisplay').textContent = codePreview;
                }
                
            } catch (error) {
                removeLoadingIndicator();
                console.error('Erreur:', error);
                addMessageToUI('assistant', `❌ Erreur: ${error.message}`, 'red');
            } finally {
                isLoading = false;
            }
        }

        function addMessageToUI(role, content, color) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} mb-4`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-3xl px-4 py-3 rounded-2xl ${
                role === 'user' 
                    ? `bg-${color}-600 text-white` 
                    : currentTheme === 'dark' 
                        ? 'card-dark shadow-sm' 
                        : currentTheme === 'night'
                            ? 'card-night shadow-sm'
                            : 'bg-white border border-gray-200 shadow-sm'
            }`;
            
            const pre = document.createElement('pre');
            pre.className = 'whitespace-pre-wrap font-sans';
            pre.textContent = content;
            
            bubble.appendChild(pre);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            
            document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
        }

        function addLoadingIndicator(color) {
            const messagesDiv = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.className = 'flex justify-start mb-4';
            loadingDiv.innerHTML = `
                <div class="${currentTheme === 'dark' ? 'card-dark' : currentTheme === 'night' ? 'card-night' : 'bg-white border border-gray-200'} px-4 py-3 rounded-2xl shadow-sm flex items-center gap-2">
                    <div class="w-2 h-2 bg-${color}-500 rounded-full animate-bounce-1"></div>
                    <div class="w-2 h-2 bg-${color}-500 rounded-full animate-bounce-2"></div>
                    <div class="w-2 h-2 bg-${color}-500 rounded-full animate-bounce-3"></div>
                </div>
            `;
            messagesDiv.appendChild(loadingDiv);
        }

        function removeLoadingIndicator() {
            const loading = document.getElementById('loadingIndicator');
            if (loading) loading.remove();
        }

        function copyCode() {
            navigator.clipboard.writeText(codePreview);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = `<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            setTimeout(() => {
                copyBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`;
            }, 2000);
        }

        function runCode() {
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(codePreview);
            doc.close();
        }
    </script>
</body>
</html>
