<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect — Chat Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Styles de base pour assurer l'affichage */
        body { background-color: #1a1d21; color: #d1d5db; }
        
        /* Scrollbar moderne */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Bannière d'erreur (cachée par défaut) -->
    <div id="error-banner" class="bg-red-600 text-white text-xs p-2 text-center hidden z-50"></div>

    <!-- Container Principal -->
    <div class="flex-1 flex min-h-0">
        
        <!-- SIDEBAR (Liste des Salons) -->
        <div class="w-64 bg-[#1e2126] border-r border-[#2b2d31] flex flex-col flex-shrink-0">
            <!-- Header Sidebar -->
            <div class="h-14 border-b border-[#2b2d31] flex items-center justify-between px-4">
                <h1 class="font-bold text-white tracking-tight text-lg">Connect<span class="text-blue-500">.</span></h1>
                <button onclick="app.toggleCreateModal()" class="bg-[#2b2d31] hover:bg-[#35373c] text-white w-8 h-8 rounded flex items-center justify-center transition">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
            </div>

            <!-- Liste des Salons -->
            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="channels-list">
                <div class="text-center text-xs text-gray-500 mt-4">Chargement des salons...</div>
            </div>

            <!-- Profil Utilisateur (Bas) -->
            <div class="p-3 bg-[#17191c] border-t border-[#2b2d31]">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold mr-3" id="user-avatar">?</div>
                    <div class="overflow-hidden">
                        <div class="text-sm font-medium text-white truncate" id="user-name">Connexion...</div>
                        <div class="text-xs text-green-500 flex items-center">
                            <span class="w-1.5 h-1.5 bg-green-500 rounded-full mr-1.5"></span> En ligne
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ZONE PRINCIPALE (Chat & Vidéo) -->
        <div class="flex-1 flex flex-col bg-[#222529] relative">
            
            <!-- Header Chat -->
            <div class="h-14 border-b border-[#2b2d31] flex items-center justify-between px-6 flex-shrink-0 bg-[#222529]">
                <div class="flex items-center">
                    <i class="fa-solid fa-hashtag text-gray-500 mr-2"></i>
                    <h2 id="current-channel-name" class="font-bold text-white">général</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="app.toggleVideoMode()" id="btn-video-mode" class="px-3 py-1.5 rounded text-sm font-medium bg-[#2b2d31] hover:bg-[#35373c] text-gray-300 transition flex items-center">
                        <i class="fa-solid fa-video mr-2"></i> Salon Vocal / Partage
                    </button>
                </div>
            </div>

            <!-- Contenu: Mode Chat (Par défaut) -->
            <div id="view-chat" class="flex-1 flex flex-col min-h-0">
                <!-- Messages -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 flex flex-col-reverse scroll-smooth">
                    <!-- Les messages s'affichent ici -->
                    <div class="text-center text-gray-500 text-sm my-auto">Aucun message pour le moment.</div>
                </div>

                <!-- Zone de saisie -->
                <div class="p-4 pt-2">
                    <div class="bg-[#2b2d31] rounded-lg p-2 flex items-end ring-1 ring-transparent focus-within:ring-blue-500 transition duration-200">
                        <textarea id="message-input" rows="1" class="bg-transparent text-white w-full px-2 py-2 outline-none resize-none placeholder-gray-500 max-h-32" placeholder="Envoyer un message..."></textarea>
                        <button onclick="app.sendMessage()" class="p-2 text-blue-500 hover:bg-[#35373c] rounded-md transition self-end">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Contenu: Mode Vidéo (Caché par défaut) -->
            <div id="view-video" class="hidden flex-1 flex flex-col items-center justify-center bg-[#111214] p-4">
                <div class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center relative">
                    
                    <!-- Placeholder quand pas de vidéo -->
                    <div id="video-placeholder" class="text-center">
                        <div class="w-24 h-24 bg-[#2b2d31] rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fa-solid fa-video-slash text-3xl text-gray-500"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-2">Salle de réunion</h3>
                        <p class="text-gray-400 mb-8">Partagez votre écran ou activez votre caméra pour commencer.</p>
                    </div>

                    <!-- Élément Vidéo -->
                    <video id="local-video" autoplay playsinline muted class="hidden w-full max-h-[70vh] bg-black rounded-lg shadow-2xl border border-[#2b2d31]"></video>

                    <!-- Contrôles -->
                    <div class="mt-8 flex space-x-4">
                        <button onclick="app.startScreenShare()" class="bg-[#2b2d31] hover:bg-[#35373c] text-white px-6 py-3 rounded-full font-medium transition flex items-center">
                            <i class="fa-solid fa-desktop mr-2"></i> Partager l'écran
                        </button>
                        <button onclick="app.stopMedia()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-full font-medium transition">
                            Couper
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Création Salon -->
    <div id="modal-create" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#222529] p-6 rounded-lg w-full max-w-sm border border-[#2b2d31] shadow-xl">
            <h3 class="text-lg font-bold text-white mb-4">Nouveau Salon</h3>
            <input type="text" id="new-channel-name" placeholder="Nom du salon (ex: projets)" class="w-full bg-[#1a1d21] text-white border border-[#2b2d31] rounded p-2.5 outline-none focus:border-blue-500 mb-4">
            <div class="flex justify-end space-x-3">
                <button onclick="app.toggleCreateModal()" class="text-gray-400 hover:text-white px-3 py-2 text-sm">Annuler</button>
                <button onclick="app.createChannel()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium">Créer</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'simple-chat-v1';

        class App {
            constructor() {
                this.db = null;
                this.auth = null;
                this.user = null;
                this.currentChannelId = 'general'; // Default ID
                this.stream = null;
                
                // DOM Elements
                this.dom = {
                    messages: document.getElementById('messages-container'),
                    channels: document.getElementById('channels-list'),
                    input: document.getElementById('message-input'),
                    videoView: document.getElementById('view-video'),
                    chatView: document.getElementById('view-chat'),
                    localVideo: document.getElementById('local-video'),
                    videoPlaceholder: document.getElementById('video-placeholder'),
                    errorBanner: document.getElementById('error-banner')
                };

                // Event Listeners
                this.dom.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                this.init();
            }

            showError(msg) {
                this.dom.errorBanner.textContent = "Erreur: " + msg;
                this.dom.errorBanner.classList.remove('hidden');
                console.error(msg);
            }

            async init() {
                if (!config) return this.showError("Configuration Firebase manquante.");

                try {
                    const firebaseApp = initializeApp(config);
                    this.auth = getAuth(firebaseApp);
                    this.db = getFirestore(firebaseApp);

                    // Auth Logic
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(this.auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(this.auth);
                    }

                    onAuthStateChanged(this.auth, (user) => {
                        if (user) {
                            this.user = user;
                            this.updateUserProfile();
                            this.loadChannels();
                            this.loadMessages();
                        } else {
                            document.getElementById('user-name').textContent = "Déconnecté";
                        }
                    });

                } catch (e) {
                    this.showError(e.message);
                }
            }

            updateUserProfile() {
                const shortId = this.user.uid.substring(0, 5).toUpperCase();
                document.getElementById('user-name').textContent = `Utilisateur ${shortId}`;
                document.getElementById('user-avatar').textContent = shortId.substring(0, 2);
            }

            // --- DATA ---

            loadChannels() {
                // On triche un peu pour la démo : si pas de collection "channels", on en crée une statique
                // en mémoire pour que l'UI ne soit jamais vide.
                const channelsRef = collection(this.db, 'artifacts', appId, 'public', 'data', 'channels');
                
                onSnapshot(channelsRef, (snapshot) => {
                    const channels = [];
                    snapshot.forEach(doc => channels.push({ id: doc.id, ...doc.data() }));
                    
                    // Ajout du canal général par défaut s'il n'existe pas dans la liste
                    if (!channels.find(c => c.name === 'général')) {
                        channels.unshift({ id: 'general', name: 'général' });
                    }

                    this.renderChannels(channels);
                }, (err) => {
                    // Fallback en cas d'erreur de droits (arrive parfois)
                    console.warn("Fallback local channels", err);
                    this.renderChannels([{ id: 'general', name: 'général (local)' }]);
                });
            }

            renderChannels(channels) {
                this.dom.channels.innerHTML = '';
                channels.forEach(ch => {
                    const div = document.createElement('div');
                    const isActive = this.currentChannelId === ch.id;
                    div.className = `px-3 py-2 rounded cursor-pointer flex items-center text-sm font-medium transition ${isActive ? 'bg-[#35373c] text-white' : 'text-gray-400 hover:bg-[#2b2d31] hover:text-gray-200'}`;
                    div.onclick = () => this.switchChannel(ch.id, ch.name);
                    div.innerHTML = `<span class="text-gray-500 mr-2">#</span> ${ch.name}`;
                    this.dom.channels.appendChild(div);
                });
            }

            switchChannel(id, name) {
                this.currentChannelId = id;
                document.getElementById('current-channel-name').textContent = name;
                this.loadMessages();
                
                // Met à jour la sidebar visuellement
                this.loadChannels(); // Reload pour mettre à jour la classe active (un peu brut mais efficace ici)
            }

            createChannel() {
                const nameInput = document.getElementById('new-channel-name');
                const name = nameInput.value.trim().toLowerCase().replace(/\s/g, '-');
                
                if (name) {
                    addDoc(collection(this.db, 'artifacts', appId, 'public', 'data', 'channels'), {
                        name: name,
                        createdAt: serverTimestamp()
                    }).catch(err => this.showError(err.message));
                    
                    nameInput.value = '';
                    this.toggleCreateModal();
                }
            }

            // --- MESSAGING ---

            loadMessages() {
                if (this.unsubMsg) this.unsubMsg();

                const q = query(
                    collection(this.db, 'artifacts', appId, 'public', 'data', 'messages'),
                    orderBy('createdAt', 'desc'),
                    limit(50)
                );

                this.unsubMsg = onSnapshot(q, (snapshot) => {
                    this.dom.messages.innerHTML = '';
                    const msgs = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        // Filtrage manuel (plus sûr sans index complexes)
                        if (d.channelId === this.currentChannelId) {
                            msgs.push({ id: doc.id, ...d });
                        }
                    });

                    if (msgs.length === 0) {
                        this.dom.messages.innerHTML = `<div class="text-center text-gray-600 mt-10 text-sm">Début du salon #${document.getElementById('current-channel-name').textContent}</div>`;
                    } else {
                        msgs.forEach(m => this.renderMessage(m));
                    }
                });
            }

            renderMessage(msg) {
                const div = document.createElement('div');
                div.className = "flex items-start group fade-in";
                
                const date = msg.createdAt ? new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                const letter = msg.userDisplay ? msg.userDisplay.charAt(msg.userDisplay.length - 1) : '?';
                const colorClass = msg.uid === this.user.uid ? 'bg-blue-600' : 'bg-gray-600';

                div.innerHTML = `
                    <div class="w-8 h-8 rounded ${colorClass} flex items-center justify-center text-xs font-bold text-white flex-shrink-0 mt-1">
                        ${letter}
                    </div>
                    <div class="ml-3 flex-1">
                        <div class="flex items-baseline">
                            <span class="text-sm font-bold text-white mr-2">${msg.userDisplay || 'Anonyme'}</span>
                            <span class="text-[10px] text-gray-500">${date}</span>
                        </div>
                        <p class="text-gray-300 text-sm leading-relaxed whitespace-pre-wrap break-words">${this.escapeHtml(msg.text)}</p>
                    </div>
                `;
                this.dom.messages.appendChild(div);
            }

            sendMessage() {
                const text = this.dom.input.value.trim();
                if (!text || !this.user) return;

                addDoc(collection(this.db, 'artifacts', appId, 'public', 'data', 'messages'), {
                    text: text,
                    uid: this.user.uid,
                    userDisplay: document.getElementById('user-name').textContent,
                    channelId: this.currentChannelId,
                    createdAt: serverTimestamp()
                }).catch(err => this.showError("Erreur envoi: " + err.message));

                this.dom.input.value = '';
            }

            // --- UI HELPERS ---

            toggleCreateModal() {
                const modal = document.getElementById('modal-create');
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) document.getElementById('new-channel-name').focus();
            }

            toggleVideoMode() {
                const isChat = !this.dom.chatView.classList.contains('hidden');
                if (isChat) {
                    this.dom.chatView.classList.add('hidden');
                    this.dom.videoView.classList.remove('hidden');
                    document.getElementById('btn-video-mode').innerHTML = '<i class="fa-solid fa-comment mr-2"></i> Retour au Chat';
                    document.getElementById('btn-video-mode').classList.replace('bg-[#2b2d31]', 'bg-blue-600');
                    document.getElementById('btn-video-mode').classList.replace('text-gray-300', 'text-white');
                } else {
                    this.dom.videoView.classList.add('hidden');
                    this.dom.chatView.classList.remove('hidden');
                    document.getElementById('btn-video-mode').innerHTML = '<i class="fa-solid fa-video mr-2"></i> Salon Vocal / Partage';
                    document.getElementById('btn-video-mode').classList.replace('bg-blue-600', 'bg-[#2b2d31]');
                    document.getElementById('btn-video-mode').classList.replace('text-white', 'text-gray-300');
                }
            }

            escapeHtml(text) {
                if (!text) return '';
                return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            // --- MEDIA ---

            async startScreenShare() {
                try {
                    this.stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    this.dom.localVideo.srcObject = this.stream;
                    this.dom.localVideo.classList.remove('hidden');
                    this.dom.videoPlaceholder.classList.add('hidden');
                    
                    // Écoute l'arrêt via l'interface du navigateur
                    this.stream.getVideoTracks()[0].onended = () => this.stop
