<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Multi-Mode AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        .bounce1 { animation: bounce 1s infinite; }
        .bounce2 { animation: bounce 1s infinite 0.1s; }
        .bounce3 { animation: bounce 1s infinite 0.2s; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .theme-dark { background: #111827; color: #f3f4f6; }
        .theme-night { background: #000; color: #dbeafe; }
        .card-dark { background: #1f2937; border-color: #374151; }
        .card-night { background: #0f172a; border-color: #1e3a8a; }
        .bg-purple { background: #9333ea; color: white; }
        .bg-blue { background: #2563eb; color: white; }
        .bg-pink { background: #ec4899; color: white; }
        .bg-red { background: #dc2626; color: white; }
        .bg-yellow { background: #eab308; color: white; }
        .dot-purple { background: #a855f7; }
        .dot-blue { background: #3b82f6; }
        .dot-pink { background: #f472b6; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #facc15; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    
    <div class="flex flex-col h-screen">
        <div class="bg-white shadow-lg border-b border-gray-200 p-4" id="header">
            <div class="max-w-7xl mx-auto">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-purple rounded-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold">Groq Multi-Mode AI</h1>
                            <p class="text-sm opacity-70" id="modeInfo">Mode: Chat</p>
                        </div>
                    </div>
                    
                    <button onclick="toggleTheme()" class="p-2 bg-white border border-gray-200 rounded-lg hover:opacity-80">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>

                <div class="flex gap-2 overflow-x-auto pb-2">
                    <button onclick="setMode('chat')" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-purple" id="btn-chat">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span>Chat</span>
                    </button>
                    <button onclick="setMode('code')" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200" id="btn-code">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        <span>Code</span>
                    </button>
                    <button onclick="setMode('image')" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200" id="btn-image">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Image</span>
                    </button>
                    <button onclick="setMode('youtube')" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200" id="btn-youtube">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span>YouTube</span>
                    </button>
                    <button onclick="setMode('extreme')" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200" id="btn-extreme">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span>Extreme</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <div class="flex flex-col flex-1" id="chatArea">
                <div class="flex-1 overflow-y-auto p-4" id="messagesContainer">
                    <div class="max-w-4xl mx-auto" id="messages">
                        <div class="text-center mt-12 opacity-60" id="welcomeMessage">
                            <p class="text-xl font-semibold">Mode Chat actif</p>
                            <p class="text-sm mt-2">Assistant IA pret</p>
                            <p class="text-xs mt-4 text-red-500">⚠️ N'oubliez pas de mettre votre cle API Groq dans le code!</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-t border-gray-200 p-4" id="inputArea">
                    <div class="max-w-4xl mx-auto flex gap-2">
                        <input type="text" id="messageInput" placeholder="Votre message..." class="flex-1 px-4 py-3 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"/>
                        <button onclick="sendMessage()" class="bg-purple px-6 py-3 rounded-lg hover:opacity-90 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div id="codePanel" class="hidden border-l border-gray-200 flex-col" style="width: 50%;">
                <div class="bg-white border-b border-gray-200 p-4 flex items-center justify-between">
                    <h2 class="font-semibold">Apercu et Code</h2>
                    <div class="flex gap-2">
                        <button onclick="copyCode()" class="p-2 bg-white border border-gray-200 rounded-lg hover:opacity-80">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                        <button onclick="runCode()" class="p-2 bg-blue rounded-lg hover:opacity-90">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                        </button>
                    </div>
                </div>
                
                <div class="flex-1 flex flex-col overflow-hidden">
                    <div class="flex-1 bg-white overflow-hidden">
                        <iframe id="preview" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
                    </div>
                    
                    <div class="h-64 bg-white border-t border-gray-200 overflow-auto">
                        <pre class="p-4 text-sm"><code id="codeDisplay">// Code ici...</code></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var GROQ_API_KEY = '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';
        var messages = [];
        var currentMode = 'chat';
        var currentTheme = 'light';
        var isLoading = false;
        var codePreview = '';

        var modes = {
            chat: { label: 'Chat', color: 'purple', model: 'llama-3.3-70b-versatile', temp: 0.7, maxTokens: 2048, systemPrompt: 'Tu es un assistant IA serviable.' },
            code: { label: 'Code', color: 'blue', model: 'llama-3.3-70b-versatile', temp: 0.3, maxTokens: 4096, systemPrompt: 'Tu es un expert en programmation. Code HTML complet.' },
            image: { label: 'Image', color: 'pink', model: 'llama-3.3-70b-versatile', temp: 0.8, maxTokens: 1024, systemPrompt: 'Tu es un expert en analyse d images.' },
            youtube: { label: 'YouTube', color: 'red', model: 'llama-3.3-70b-versatile', temp: 0.8, maxTokens: 3072, systemPrompt: 'Tu es un expert YouTube. Scripts SEO.' },
            extreme: { label: 'Extreme', color: 'yellow', model: 'llama-3.1-8b-instant', temp: 0.9, maxTokens: 8192, systemPrompt: 'Mode EXTREME. Reponse rapide et creative.' }
        };

        function setMode(mode) {
            currentMode = mode;
            var modeConfig = modes[mode];
            document.getElementById('modeInfo').textContent = 'Mode: ' + modeConfig.label;
            document.getElementById('messageInput').placeholder = 'Message en mode ' + modeConfig.label + '...';
            
            var buttons = ['chat', 'code', 'image', 'youtube', 'extreme'];
            for (var i = 0; i < buttons.length; i++) {
                var btn = buttons[i];
                var btnEl = document.getElementById('btn-' + btn);
                if (btn === mode) {
                    btnEl.className = 'flex items-center gap-2 px-4 py-2 rounded-lg bg-' + modeConfig.color;
                } else {
                    btnEl.className = 'flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-gray-200';
                }
            }
            
            if (mode === 'code') {
                document.getElementById('chatArea').style.width = '50%';
                document.getElementById('codePanel').style.display = 'flex';
                document.getElementById('codePanel').classList.remove('hidden');
            } else {
                document.getElementById('chatArea').style.width = '100%';
                document.getElementById('codePanel').style.display = 'none';
                document.getElementById('codePanel').classList.add('hidden');
            }
            
            document.getElementById('welcomeMessage').innerHTML = '<p class="text-xl font-semibold">Mode ' + modeConfig.label + '</p><p class="text-sm mt-2">' + modeConfig.systemPrompt + '</p>';
        }

        function toggleTheme() {
            var body = document.body;
            var header = document.getElementById('header');
            var inputArea = document.getElementById('inputArea');
            
            if (currentTheme === 'light') {
                currentTheme = 'dark';
                body.className = 'theme-dark';
                header.className = 'card-dark shadow-lg border-b p-4';
                inputArea.className = 'card-dark border-t p-4';
            } else if (currentTheme === 'dark') {
                currentTheme = 'night';
                body.className = 'theme-night';
                header.className = 'card-night shadow-lg border-b p-4';
                inputArea.className = 'card-night border-t p-4';
            } else {
                currentTheme = 'light';
                body.className = 'bg-gray-50 text-gray-900';
                header.className = 'bg-white shadow-lg border-b border-gray-200 p-4';
                inputArea.className = 'bg-white border-t border-gray-200 p-4';
            }
        }

        function sendMessage() {
            var input = document.getElementById('messageInput');
            var messageText = input.value.trim();
            
            if (!messageText || isLoading) return;
            
            if (GROQ_API_KEY === 'VOTRE_CLE_GROQ_ICI' || !GROQ_API_KEY) {
                alert('Erreur: Vous devez configurer votre cle API Groq dans le code!\n\nRemplacez VOTRE_CLE_GROQ_ICI par votre vraie cle API.\n\nObtenez-en une gratuitement sur: https://console.groq.com');
                return;
            }
            
            var modeConfig = modes[currentMode];
            document.getElementById('welcomeMessage').style.display = 'none';
            
            messages.push({ role: 'user', content: messageText });
            addMessageToUI('user', messageText, modeConfig.color);
            
            input.value = '';
            isLoading = true;
            addLoadingIndicator(modeConfig.color);
            
            fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
                body: JSON.stringify({
                    model: modeConfig.model,
                    messages: [{ role: 'system', content: modeConfig.systemPrompt }].concat(messages),
                    temperature: modeConfig.temp,
                    max_tokens: modeConfig.maxTokens
                })
            })
            .then(function(response) {
                removeLoadingIndicator();
                if (!response.ok) {
                    return response.json().then(function(err) {
                        throw new Error('API Error ' + response.status + ': ' + (err.error && err.error.message ? err.error.message : 'Verifiez votre cle API'));
                    });
                }
                return response.json();
            })
            .then(function(data) {
                var content = data.choices[0].message.content;
                messages.push({ role: 'assistant', content: content });
                addMessageToUI('assistant', content, modeConfig.color);
                
                if (currentMode === 'code') {
                    var match = content.match(/```(?:html|javascript|js|css)?\n?([\s\S]*?)```/);
                    codePreview = match ? match[1] : content;
                    document.getElementById('codeDisplay').textContent = codePreview;
                    runCode();
                }
                isLoading = false;
            })
            .catch(function(error) {
                removeLoadingIndicator();
                console.error('Erreur:', error);
                addMessageToUI('assistant', 'Erreur: ' + error.message, 'red');
                isLoading = false;
            });
        }

        function addMessageToUI(role, content, color) {
            var messagesDiv = document.getElementById('messages');
            var messageDiv = document.createElement('div');
            messageDiv.className = 'flex ' + (role === 'user' ? 'justify-end' : 'justify-start') + ' mb-4';
            
            var bubble = document.createElement('div');
            var bgClass = role === 'user' ? 'bg-' + color : (currentTheme === 'dark' ? 'card-dark' : currentTheme === 'night' ? 'card-night' : 'bg-white border border-gray-200');
            bubble.className = 'max-w-3xl px-4 py-3 rounded-2xl shadow-sm ' + bgClass;
            
            var pre = document.createElement('pre');
            pre.className = 'whitespace-pre-wrap font-sans';
            pre.textContent = content;
            
            bubble.appendChild(pre);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            document.getElementById('messagesContainer').scrollTop = 999999;
        }

        function addLoadingIndicator(color) {
            var messagesDiv = document.getElementById('messages');
            var loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.className = 'flex justify-start mb-4';
            
            var bubble = document.createElement('div');
            var bgClass = currentTheme === 'dark' ? 'card-dark' : currentTheme === 'night' ? 'card-night' : 'bg-white border border-gray-200';
            bubble.className = bgClass + ' px-4 py-3 rounded-2xl shadow-sm flex items-center gap-2';
            bubble.innerHTML = '<div class="w-2 h-2 dot-' + color + ' rounded-full bounce1"></div><div class="w-2 h-2 dot-' + color + ' rounded-full bounce2"></div><div class="w-2 h-2 dot-' + color + ' rounded-full bounce3"></div>';
            
            loadingDiv.appendChild(bubble);
            messagesDiv.appendChild(loadingDiv);
        }

        function removeLoadingIndicator() {
            var loading = document.getElementById('loadingIndicator');
            if (loading) loading.remove();
        }

        function copyCode() {
            navigator.clipboard.writeText(codePreview);
            alert('Code copie!');
        }

        function runCode() {
            if (!codePreview) return;
            var iframe = document.getElementById('preview');
            var doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(codePreview);
            doc.close();
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        window.onload = function() {
            if (GROQ_API_KEY === 'VOTRE_CLE_GROQ_ICI' || !GROQ_API_KEY) {
                document.getElementById('welcomeMessage').innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-6 py-4 rounded-lg"><p class="font-bold text-lg">⚠️ Configuration requise</p><p class="mt-2">Vous devez configurer votre cle API Groq!</p><p class="mt-2 text-sm">1. Allez sur <a href="https://console.groq.com" target="_blank" class="underline">console.groq.com</a></p><p class="text-sm">2. Creez un compte gratuit</p><p class="text-sm">3. Generez une cle API</p><p class="text-sm">4. Remplacez VOTRE_CLE_GROQ_ICI dans le code (ligne 113)</p></div>';
            }
        };
    </script>
</body>
</html>
