<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IA Groq – Chat Interface</title>

<style>
    body {
        margin: 0;
        background: #101010;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
        width: 260px;
        background: #1b1b1b;
        padding: 20px;
        display: flex;
        flex-direction: column;
        border-right: 2px solid #222;
    }

    .sidebar h2 {
        font-size: 20px;
        margin-bottom: 15px;
        color: #4CAF50;
    }

    .sidebar select {
        padding: 10px;
        font-size: 16px;
        background: #262626;
        color: white;
        border-radius: 8px;
        border: none;
    }

    .sidebar button {
        margin-top: 20px;
        padding: 12px;
        background: #4caf50;
        border: none;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
    }

    /* Chat container */
    .chat {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* Messages area */
    .messages {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
    }

    .msg {
        max-width: 70%;
        margin-bottom: 15px;
        padding: 12px 15px;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .user {
        background: #4caf50;
        color: white;
        margin-left: auto;
    }

    .bot {
        background: #222;
        color: white;
        margin-right: auto;
        border: 1px solid #333;
    }

    /* Input area */
    .input-zone {
        padding: 15px;
        display: flex;
        gap: 10px;
        border-top: 2px solid #222;
        background: #161616;
    }

    .input-zone input {
        flex-grow: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #262626;
        color: white;
        font-size: 18px;
    }

    .input-zone button {
        padding: 12px 20px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

</style>
</head>

<body>

<div class="sidebar">
    <h2>Modes IA</h2>

    <select id="mode">
        <option value="normal">Mode Normal</option>
        <option value="ytpro">YouTube Pro</option>
        <option value="ultimate">Mode Ultime</option>
        <option value="image">Mode Image (texte)</option>
    </select>

    <button id="publish">Publier sur le site</button>
</div>

<div class="chat">
    <div class="messages" id="messages"></div>

    <div class="input-zone">
        <input id="prompt" placeholder="Message…">
        <button id="run">Envoyer</button>
    </div>
</div>

<script>
const apiKey = "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"; // ⚠️ Ta clé ici

function addMessage(text, type) {
    const msg = document.createElement("div");
    msg.className = "msg " + type;
    msg.textContent = text;
    document.getElementById("messages").appendChild(msg);
    msg.scrollIntoView();
}

async function askGroq(system, userMsg) {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
            model: "mixtral-8x7b-32768",
            messages: [
                { role: "system", content: system },
                { role: "user", content: userMsg }
            ]
        })
    });

    const data = await res.json();
    return data.choices?.[0]?.message?.content || "Erreur API";
}

document.getElementById("run").onclick = async () => {
    const mode = document.getElementById("mode").value;
    const prompt = document.getElementById("prompt").value;

    if (!prompt.trim()) return;

    addMessage(prompt, "user");
    document.getElementById("prompt").value = "";

    let systemPrompt = "";

    if (mode === "normal") systemPrompt = "Tu es une IA simple, utile et claire.";
    if (mode === "ultimate") systemPrompt = "Tu es une IA très avancée, précise et détaillée.";
    if (mode === "ytpro") systemPrompt =
        "Tu es YouTube Pro IA. Si on t'envoie une URL YouTube, tu fais : résumé, analyse, timestamps, points clés.";
    if (mode === "image") systemPrompt =
        "Décris une image très précisément, comme si tu la générais.";

    addMessage("⏳ Réflexion…", "bot");

    const reply = await askGroq(systemPrompt, prompt);

    // Remplace le message "réflexion…" par la vraie réponse
    const messages = document.getElementById("messages");
    messages.lastChild.remove();
    addMessage(reply, "bot");
};

document.getElementById("publish").onclick = () => {
    const allText = [...document.getElementById("messages").children]
        .map(m => (m.classList.contains("user") ? "👤 User:\n" : "🤖 IA:\n") + m.innerText)
        .join("\n\n");

    const blob = new Blob([allText], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "publication.txt";
    a.click();
};
</script>

</body>
</html>
